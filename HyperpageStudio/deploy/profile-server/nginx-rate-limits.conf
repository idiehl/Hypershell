# Install as /etc/nginx/conf.d/hypershell-profile-rate-limits.conf.
# These limits use the public client address observed by Nginx. The profile
# server also applies its own socket-address limits as a second boundary.
limit_req_zone $binary_remote_addr zone=hypershell_profile_signin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hypershell_profile_api:10m rate=4r/s;
limit_req_zone $binary_remote_addr zone=hypershell_device_authorization:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=hypershell_device_token:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=hypershell_admin_portal:10m rate=2r/s;
