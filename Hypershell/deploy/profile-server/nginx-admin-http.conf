# Temporary HTTP-only host used to obtain the dedicated admin certificate.
# Install as /etc/nginx/sites-available/admin.atlasuniversalis.com.
server {
    listen 80;
    listen [::]:80;
    server_name admin.atlasuniversalis.com;
    server_tokens off;

    access_log /var/log/nginx/hypershell-admin-access.log;
    error_log /var/log/nginx/hypershell-admin-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
