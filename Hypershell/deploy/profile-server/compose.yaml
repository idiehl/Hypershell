name: hypershell-profile

services:
  profile-server:
    image: "${HYPERSHELL_PROFILE_IMAGE:-hypershell-profile-server:2026.08.14-foundation}"
    build:
      context: ../..
      dockerfile: src/Hypershell.ProfileServer/Dockerfile
    container_name: "${HYPERSHELL_PROFILE_CONTAINER:-hypershell-profile-server}"
    user: "1654:1654"
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      HYPERSHELL_PROFILE_SERVER_DATA: /var/lib/hypershell-profile-server
      HYPERSHELL_PROFILE_SESSION_MINUTES: "30"
      HYPERSHELL_PROFILE_ACCOUNT_STORAGE_MIB: "512"
      HYPERSHELL_MINIMUM_FREE_STORAGE_MIB: "512"
      HYPERSHELL_PUBLIC_PORTAL_ORIGIN: https://admin.atlasuniversalis.com
      HYPERSHELL_RELEASE_SIGNER_SHA256: "${HYPERSHELL_RELEASE_SIGNER_SHA256:-}"
      HYPERSHELL_STABLE_RELEASE_RETENTION: "3"
      HYPERSHELL_DATA_PROTECTION_CERTIFICATE: /run/secrets/hypershell_data_protection_certificate
      HYPERSHELL_DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE: /run/secrets/hypershell_data_protection_password
      HYPERSHELL_SSH_VAULT_MASTER_KEY_FILE: /run/secrets/hypershell_ssh_vault_master_key
      HYPERSHELL_BACKUP_EXPORTS: /var/lib/hypershell-backup-exports
    secrets:
      - hypershell_data_protection_certificate
      - hypershell_data_protection_password
      - hypershell_ssh_vault_master_key
    volumes:
      - hypershell-profile-data:/var/lib/hypershell-profile-server
      - "${HYPERSHELL_BACKUP_EXPORTS_SOURCE:-/opt/hypershell/exports}:/var/lib/hypershell-backup-exports:ro"
    ports:
      - "127.0.0.1:${HYPERSHELL_PROFILE_PORT:-5088}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  hypershell-profile-data:
    name: "${HYPERSHELL_PROFILE_VOLUME:-hypershell-profile-data}"

secrets:
  hypershell_data_protection_certificate:
    file: /etc/hypershell-profile-server/secrets/data-protection.pfx
  hypershell_data_protection_password:
    file: /etc/hypershell-profile-server/secrets/data-protection.password
  hypershell_ssh_vault_master_key:
    file: /etc/hypershell-profile-server/secrets/ssh-vault-master-key.bin
