# Final HTTPS reverse proxy. The Hypershell desktop must be configured with
# https://hypershell.atlasuniversalis.com/ directly because it refuses API
# redirects by design.
server {
    listen 80;
    listen [::]:80;
    server_name hypershell.atlasuniversalis.com;
    server_tokens off;

    access_log /var/log/nginx/hypershell-profile-access.log;
    error_log /var/log/nginx/hypershell-profile-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hypershell.atlasuniversalis.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/hypershell.atlasuniversalis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hypershell.atlasuniversalis.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/hypershell-profile-access.log;
    error_log /var/log/nginx/hypershell-profile-error.log;

    client_max_body_size 4m;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        limit_req zone=hypershell_profile_api burst=20 nodelay;
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }

    location = /api/hypershell/v1/auth/session {
        limit_req zone=hypershell_profile_signin burst=5 nodelay;
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }

    location ^~ /api/hypershell/v1/profiles {
        limit_req zone=hypershell_profile_api burst=40 nodelay;
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }

    location = /api/hypershell/v2/auth/device {
        limit_req zone=hypershell_device_authorization burst=8 nodelay;
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }

    location = /api/hypershell/v2/auth/device/token {
        limit_req zone=hypershell_device_token burst=20 nodelay;
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }

    location = /api/hypershell/v2/auth/refresh {
        limit_req zone=hypershell_device_token burst=10 nodelay;
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }

    location ^~ /api/hypershell/v2/ {
        limit_req zone=hypershell_profile_api burst=40 nodelay;
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }

    # Public distribution is an explicit allowlist. Admin/profile pages remain
    # unreachable on this hostname through the default 404 below.
    location = /downloads {
        limit_except GET { deny all; }
        limit_req zone=hypershell_profile_api burst=20 nodelay;
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }

    location ^~ /downloads/ {
        limit_except GET { deny all; }
        limit_req zone=hypershell_profile_api burst=40 nodelay;
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }

    location = /css/downloads.css {
        limit_except GET { deny all; }
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }

    location = /favicon.ico {
        limit_except GET { deny all; }
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }

    location / {
        return 404;
    }
}
