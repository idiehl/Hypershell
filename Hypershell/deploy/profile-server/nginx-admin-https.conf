# Private Hypershell administration portal. It shares the account service
# process with the desktop API but has its own hostname and TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name admin.atlasuniversalis.com;
    server_tokens off;

    access_log /var/log/nginx/hypershell-admin-access.log;
    error_log /var/log/nginx/hypershell-admin-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.atlasuniversalis.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/admin.atlasuniversalis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.atlasuniversalis.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/hypershell-admin-access.log;
    error_log /var/log/nginx/hypershell-admin-error.log;

    client_max_body_size 1m;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location / {
        limit_req zone=hypershell_admin_portal burst=20 nodelay;
        proxy_pass http://hypershell_profile_backend;
        include /etc/nginx/snippets/hypershell-profile-proxy.conf;
    }
}
