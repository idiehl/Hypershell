# Temporary HTTP-only host used solely to obtain the first certificate.
# Install as /etc/nginx/sites-available/hypershell.atlasuniversalis.com.
server {
    listen 80;
    listen [::]:80;
    server_name hypershell.atlasuniversalis.com;

    access_log /var/log/nginx/hypershell-profile-access.log;
    error_log /var/log/nginx/hypershell-profile-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
